name: DocBadger Feedback Tracker

# CONFIRMED (verified empirically against a real throwaway repo): editing a
# GitHub comment — a full text rewrite or toggling a task-list checkbox — is
# gated identically: only the comment's original author or a user with
# WRITE permission to the repo can do either. comment.user stays as the
# original author (the bot) regardless of who edits it; sender.login
# reflects who actually performed the action.
#
# Real implication: only maintainers/collaborators with write access can
# give feedback this way. In a typical fork-based OSS contribution model, an
# external PR author usually lacks write access and cannot toggle the
# checkbox on their own PR's comment — feedback capture reaches repo
# collaborators reviewing a PR, not necessarily the PR's own author.
#
# Never blocks or gates a PR merge — purely observational
# (Product Decision Log Entry 11). No PyGithub / GitHub API calls are made;
# this only reads the webhook event payload GitHub already provides and
# writes to the docbadger/index branch via git plumbing.

on:
  issue_comment:
    types: [edited]

permissions:
  contents: write   # to push feedback.json to the docbadger/index branch

jobs:
  track-feedback:
    if: github.event.issue.pull_request != null   # PR comments only, not plain issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        # This checkout is what the tracker script's git operations (push/pull
        # to docbadger/index) actually run against — feedback is per-project
        # state, same as the embedding cache, so it belongs to THIS repo's
        # origin, not DocBadger's own source repo.

      - name: Checkout DocBadger source
        uses: actions/checkout@v4
        with:
          repository: netanyaj/docbadger
          ref: main
          path: .docbadger-src
        # The tracker SCRIPT itself doesn't exist in this repo's checkout —
        # it only lives in the DocBadger source repo. This is why the main
        # doc-check doesn't need this extra step: `uses: netanyaj/docbadger@main`
        # is GitHub's actual mechanism for pulling in another repo's Action
        # code automatically. A plain `run:` step has no equivalent — it only
        # ever sees what's already checked out, so we fetch it explicitly.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Track feedback
        env:
          DOCBADGER_BOT_LOGIN: "github-actions[bot]"
        run: python .docbadger-src/src/feedback_tracker_main.py
        # Runs with cwd = this repo's checkout (github.workspace) by default,
        # which is what index_branch_sync.py's git plumbing needs — the
        # script's own location in .docbadger-src doesn't change that, since
        # its subprocess calls never hardcode a path, only the CWD they're
        # invoked from.
